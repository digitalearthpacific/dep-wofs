[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dep-wofs"
version = "0.2.0"
description = "Water observations mapping for Digital Earth Pacific"
authors = [{ name = "Jesse Anderson", email = "jesse.anderson@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloud-logger",
    "dep-tools",
    "numpy==1.26.4",
    "odc-stats>=1.9.0",
    "typer>=0.16.0",
    "wofs>=1.6.8",
]

[tool.setuptools]
packages = [ "dep_wofs" ]

[tool.uv]
# dep-tools and odc-stats declare gdal but the code we use never imports osgeo;
# dropping it avoids building the bindings against a system GDAL
override-dependencies = ["gdal; sys_platform == 'never'"]

[tool.uv.sources]
dep-tools = { git = "https://github.com/digitalearthpacific/dep-tools.git" }
cloud-logger = { git = "https://github.com/jessjaco/cloud-logger.git" }

[dependency-groups]
dev = [
    "black>=26.10.1",
]
validation = [
    "plotnine>=0.15.8",
    "tabulate>=0.10.0",
]
