kind: Workflow
metadata:
  generateName: wofs-annual-
  namespace: argo
spec:
  entrypoint: loop-map-wofs
  serviceAccountName: open-data-bucket-writer
  podGC:
    strategy: OnPodSuccess
    deleteDelayDuration: 600s
  parallelism: 20
  podMetadata:
    labels:
      app: wofs
    annotations:
      karpenter.sh/do-not-disrupt: "true"
  nodeSelector:
    dep/workload: data-processing
  tolerations:
  - key: dep/workload
    operator: Equal
    value: data-processing
    effect: NoSchedule
  hostAliases:
    - ip: "52.92.184.90"
      hostnames:
        - "dep-public-staging.s3.us-west-2.amazonaws.com"
    - ip: "52.92.184.90"
      hostnames:
        - "dep-public-data.s3.us-west-2.amazonaws.com"
  arguments:
    parameters:
      # I bumped this version for the current backfill
      # because we are making new summaries for 2020-2023
    - name: version
      value: "0.2.1"  
    - name: image-tag
      value: "v0.2.3"
  templates:
  - name: loop-map-wofs
    retryStrategy:
      limit: "2"
      retryPolicy: "Always"
    dag:
      tasks:
        - name: generate-ids
          template: generate
          arguments:
            parameters:
              - name: limit
                value: "9999"
              - name: years
                value: "2020" 
              - name: version
                value: "{{ workflow.parameters.version }}"
              - name: dataset-id
                value: "wofs_summary_annual"
              - name: overwrite-existing-log
                value: "False"
        - name: process-id
          depends: generate-ids.Succeeded
          template: process-wofs-tile
          retryStrategy:
            limit: "2"
            retryPolicy: "Always"
          arguments:
            parameters:
            - name: row
              value: "{{item.row}}"
            - name: column
              value: "{{item.column}}"
            - name: datetime
              value: "{{item.datetime}}"
            - name: version
              value: "{{ workflow.parameters.version }}"
          withParam: "{{ tasks.generate-ids.outputs.result }}"

  - name: generate
    inputs:
      parameters:
      - name: limit
      - name: years
      - name: version
      - name: dataset-id
      - name: overwrite-existing-log
    container:
      image: "ghcr.io/digitalearthpacific/dep-wofs:{{ workflow.parameters.image-tag }}"
      imagePullPolicy: IfNotPresent
      resources:
        requests: 
          memory: 100Mi
          cpu: 1.0
      command: [ python ]
      args:
        - dep_wofs/print_tasks.py
        - --years
        - "{{ inputs.parameters.years }}"
        - --version
        - "{{ inputs.parameters.version }}"
        - --limit
        - "{{ inputs.parameters.limit }}"
        - --dataset-id
        - "{{ inputs.parameters.dataset-id }}"
        - --overwrite-existing-log
        - "{{ inputs.parameters.overwrite-existing-log }}"
  - name: process-wofs-tile
    inputs:
      parameters:
      - name: row
      - name: column
      - name: datetime
      - name: version
    container:
      image: "ghcr.io/digitalearthpacific/dep-wofs:{{ workflow.parameters.image-tag }}"
      imagePullPolicy: IfNotPresent
      resources:
        requests: 
          memory: 5Gi
          cpu: 4.0
        limits:
          cpu: 6.0
          memory: 15Gi
      command: [ python ]
      args:
        - dep_wofs/process_wofs_tile.py
        - --row
        - "{{ inputs.parameters.row }}"
        - --column
        - "{{ inputs.parameters.column }}"
        - --datetime
        - "{{ inputs.parameters.datetime }}"
        - --version
        - "{{ inputs.parameters.version }}"
      env:
        - name: DASK_ARRAY__RECHUNK__METHOD
          value: "tasks"
