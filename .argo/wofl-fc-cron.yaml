kind: CronWorkflow
metadata:
  generateName: daily-wofl-fc-
  namespace: argo
spec:
  schedule: "0 2 * * *"
  workflowSpec:
    entrypoint: loop-map-wofls
    schedules:
      - "0 2 * * *"
    serviceAccountName: open-data-bucket-writer
    podGC:
      strategy: OnPodSuccess
      deleteDelayDuration: 600s
    parallelism: 100
    activeDeadlineSeconds: 36000 
    tolerations:
    - key: digitalearthpacific.org/node-purpose
      operator: Equal
      value: argo
      effect: NoSchedule
    nodeSelector:
      karpenter.sh/capacity-type: "spot"
    arguments:
      parameters:
      - name: bucket
        value: "dep-public-data"
        # These are only used for determining the path when 
        # indexing, they are NOT passed to the data creation
        # task themselves.
      - name: wofl-version
        value: "0-2-0" 
      - name: fc-version
        value: "0-1-0"
      - name: wofl-image-tag
        value: "0.2.1"
      - name: fc-image-tag
        value: "0.1.2"
      - name: number-of-days
        value: 5
    templates:
    - name: loop-map-wofls
      retryStrategy:
        limit: "2"
        retryPolicy: "OnFailure"
      dag:
        tasks:
          - name: generate-ids
            template: generate
          - name: process-id
            depends: generate-ids.Succeeded
            # I use a secondary dag here so wofl & fc are created at roughly the same 
            # time. When they happened serially (all wofl then all fc) there were
            # images that sometimes became available after wofl had started but
            # before fc (seriously).
            template: process-id-dag
            withParam: "{{ tasks.generate-ids.outputs.result }}"
            arguments:
              parameters:
                - name: path
                  value: "{{ item.path }}"
                - name: row
                  value: "{{ item.row }}"
          - name: index-wofl-results
            depends: process-id.Succeeded 
            templateRef:
              name: stac-items-ingest
              template: stac-items
            arguments:
              parameters:
                - name: bucket
                  value: "{{ workflow.parameters.bucket }}"
                - name: prefix
                  value: "dep_ls_wofl/{{ workflow.parameters.wofl-version }}"
          - name: index-fc-results
            depends: index-wofl-results.Succeeded 
            templateRef:
              name: stac-items-ingest
              template: stac-items
            arguments:
              parameters:
                - name: bucket
                  value: "{{ workflow.parameters.bucket }}"
                - name: prefix
                  value: "dep_ls_fc/{{ workflow.parameters.fc-version }}"
          - name: ows-index
            depends: index-fc-results.Succeeded 
            templateRef:
              name: datacube-stac-indexer
              template: stac-indexing
            arguments:
              parameters:
                - name: collections
                # Need comma separated here
                  value: "dep_ls_wofl,dep_ls_fc"
                # Set this to the range of dates over which the cron job could
                # possibly ever run
                - name: datetime
                  value: "2025/2030"
                - name: arguments
                  value: ""
                - name: bbox
                  value: "-180.0,-70,180.0,70"
                - name: catalog
                  value: "https://stac.digitalearthpacific.org/"
          - name: ows-update
            depends: ows-index.Succeeded
            templateRef:
              name: datacube-ows-update
              template: ows-update
            arguments:
              parameters:
                - name: products
                # Need space separated here
                  value: "dep_ls_wofl dep_ls_fc"
    - name: generate
      container:
        image: "ghcr.io/digitalearthpacific/dep-wofs:{{ workflow.parameters.wofl-image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests: 
            memory: 100Mi
            cpu: 1.0
        command: [ python ]
        args:
          - dep_wofs/process_wofls_recent.py
          - list
    - name: process-id-dag
      inputs:
        parameters:
          - name: path
          - name: row
      dag:
        tasks:
          - name: wofl
            template: process-wofl-tile
            arguments:
              parameters:
                - name: path
                  value: "{{ inputs.parameters.path }}"
                - name: row
                  value: "{{ inputs.parameters.row }}"
          - name: fc
            template: process-fc-tile
            arguments:
              parameters:
                - name: path
                  value: "{{ inputs.parameters.path }}"
                - name: row
                  value: "{{ inputs.parameters.row }}"
    - name: process-wofl-tile
      inputs:
        parameters:
        - name: path
        - name: row
      container:
        image: "ghcr.io/digitalearthpacific/dep-wofs:{{ workflow.parameters.wofl-image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests: 
            memory: 4Gi
            cpu: 2.0
          limits:
            cpu: 6.0
            memory: 32Gi
        command: [ python ]
        args:
          - dep_wofs/process_wofls_recent.py
          - process-tile
          - --path
          - "{{ inputs.parameters.path }}"
          - --row
          - "{{ inputs.parameters.row }}"
          - --number-of-days
          - "{{ workflow.parameters.number-of-days }}"
    - name: process-fc-tile
      inputs:
        parameters:
        - name: path
        - name: row
      container:
        image: "ghcr.io/digitalearthpacific/dep-fc:{{ workflow.parameters.fc-image-tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests: 
            cpu: 2.0
            memory: 8Gi
          limits:
            cpu: 2.0
            memory: 8Gi
        command: [ "uv", "run" ]
        args:
          - process_recent_landsat_scenes.py
          - process-tile
          - --path
          - "{{ inputs.parameters.path }}"
          - --row
          - "{{ inputs.parameters.row }}"
          - --number-of-days
          - "{{ workflow.parameters.number-of-days }}"
